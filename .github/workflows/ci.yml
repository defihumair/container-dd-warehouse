name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install numpy pyodbc pytest

      - name: Install ODBC Driver 18
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" > /dev/null 2>&1; then
            curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - name: Generate test data
        run: python data_generator/generate.py --days 60 --containers 3000

      - name: Start SQL Server
        run: |
          docker run -d --name sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -p 1433:1433 \
            -v "$GITHUB_WORKSPACE/data:/data" -v "$GITHUB_WORKSPACE:/repo" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 3
          done
          docker logs sql
          exit 1

      - name: Deploy database objects
        run: docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -I -i /repo/sql/deploy_all.sql
        
      - name: Run pipeline (first load)
        run: python pipeline/run_pipeline.py

      - name: Run pipeline again (idempotency)
        run: python pipeline/run_pipeline.py

      - name: Run tests
        run: pytest
